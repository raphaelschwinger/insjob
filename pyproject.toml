[project]
name = "insjob"
version = "0.1.0"
description = "Run training, data processing and notebooks on the INS GPU servers from your laptop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "json5>=0.9",
]

[project.optional-dependencies]
# installed only inside the agent container on the servers
agent = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "nvidia-ml-py>=12",
]

[project.scripts]
job = "insjob.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insjob"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "insjob/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
